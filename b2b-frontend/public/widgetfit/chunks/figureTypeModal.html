<div>
  <div class="mmltov1-modal__heading">Your figure type</div>

  <div class="mmltov1-modal__subheading">
    Choose the image that best reflects your current figure
  </div>

  <div class="mmltov1-card-switch mmltov1-figure-type-modal__switch" data-name="figureType">
    <div class="mmltov1-card-switch__cards">
      <div
        class="mmltov1-card-switch__card"
        data-value="pear"
        data-label="Pear"
        data-bg-female="figure-type-female-pear.png"
        data-bg-male="figure-type-male-pear.png"
      ></div>
      <div
        class="mmltov1-card-switch__card"
        data-value="a-line"
        data-label="A-line"
        data-bg-female="figure-type-female-a-line.png"
        data-bg-male="figure-type-male-a-line.png"
      ></div>
      <div
        class="mmltov1-card-switch__card"
        data-value="rectangle"
        data-label="Rectangle"
        data-bg-female="figure-type-female-rectangle.png"
        data-bg-male="figure-type-male-rectangle.png"
      ></div>
      <div
        class="mmltov1-card-switch__card"
        data-value="triangle"
        data-label="Triangle"
        data-bg-female="figure-type-female-triangle.png"
        data-bg-male="figure-type-male-triangle.png"
      ></div>
      <div
        class="mmltov1-card-switch__card"
        data-value="hourglass"
        data-label="Hourglass"
        data-bg-female="figure-type-female-hourglass.png"
        data-bg-male="figure-type-male-hourglass.png"
      ></div>
      <div
        class="mmltov1-card-switch__card"
        data-value="apple"
        data-label="Apple"
        data-bg-female="figure-type-female-apple.png"
        data-bg-male="figure-type-male-apple.png"
      ></div>
    </div>
    <div class="mmltov1-card-switch__controls">
      <div class="mmltov1-card-switch__btn-left"></div>
      <div class="mmltov1-card-switch__label"></div>
      <div class="mmltov1-card-switch__btn-right"></div>
    </div>
  </div>
  <div class="mmltov1-figure-type-modal__buttons">
    <div class="mmltov1-btn-secondary">Back</div>
    <div class="mmltov1-btn-primary">Continue</div>
  </div>
</div>
