<div>
  <div class="mmltov1-modal__heading">Your parameters</div>

  <div class="mmltov1-modal__subheading">
    Please provide your parameters so we can find the right size of things for you.
  </div>

  <div class="mmltov1-your-parameters-modal__slider">
    <input
      type="text"
      data-widget="slider"
      data-min="50"
      data-max="150"
      data-name="chestCircumference"
      data-label="Chest circumference"
      data-unit-label="cm"
    />
  </div>

  <div class="mmltov1-your-parameters-modal__slider">
    <input
      type="text"
      data-widget="slider"
      data-min="20"
      data-max="100"
      data-name="waistCircumference"
      data-label="Waist circumference"
      data-unit-label="cm"
    />
  </div>

  <div class="mmltov1-your-parameters-modal__slider">
    <input
      type="text"
      data-widget="slider"
      data-min="50"
      data-max="200"
      data-name="hipCircumference"
      data-label="Hip circumference"
      data-unit-label="cm"
    />
  </div>

  <div
    class="mmltov1-multi-switch mmltov1-your-parameters-modal__size-switch"
    data-items="40,42,44,46,48,50,52,54,56,58,60"
    data-name="size"
  >
    <div class="mmltov1-multi-switch__label">Size (EU)</div>
    <div class="mmltov1-multi-switch__items"></div>
  </div>

  <div class="mmltov1-your-parameters-modal__buttons">
    <div class="mmltov1-btn-secondary">Back</div>

    <div class="mmltov1-btn-primary">Continue</div>
  </div>
</div>
