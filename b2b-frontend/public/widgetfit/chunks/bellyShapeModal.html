<div>
  <div class="mmltov1-modal__heading">Your belly shape</div>

  <div class="mmltov1-modal__subheading">
    Choose the image that most resembles the shape of your belly
  </div>

  <div class="mmltov1-card-switch mmltov1-belly-shape-modal__switch" data-name="bellyShape">
    <div class="mmltov1-card-switch__cards">
      <div
        class="mmltov1-card-switch__card"
        data-value="flat"
        data-label="Flat"
        data-bg-female="belly-shape-female-flat.svg"
        data-bg-male="belly-shape-male-flat.svg"
      ></div>
      <div
        class="mmltov1-card-switch__card"
        data-value="medium"
        data-label="Medium"
        data-bg-female="belly-shape-female-medium.svg"
        data-bg-male="belly-shape-male-medium.svg"
      ></div>
      <div
        class="mmltov1-card-switch__card"
        data-value="gross"
        data-label="Gross"
        data-bg-female="belly-shape-female-gross.svg"
        data-bg-male="belly-shape-male-gross.svg"
      ></div>
    </div>
    <div class="mmltov1-card-switch__controls">
      <div class="mmltov1-card-switch__btn-left"></div>
      <div class="mmltov1-card-switch__label"></div>
      <div class="mmltov1-card-switch__btn-right"></div>
    </div>
  </div>

  <div class="mmltov1-belly-shape-modal__buttons">
    <div class="mmltov1-btn-secondary">Back</div>

    <div class="mmltov1-btn-primary">Continue</div>
  </div>
</div>
