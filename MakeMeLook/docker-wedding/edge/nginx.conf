# =============================================================================
# edge nginx — public entrypoint on host port 3010
#
# Responsibilities:
#   1. Serve /s3/widget-assets/* directly from mml-saas-widget-tryon/src/assets
#      (bypassing MinIO entirely — the files already exist on disk).
#   2. Proxy everything else to the Go backend at http://backend:3010.
#   3. Allow cross-origin requests from the shop (localhost:8080) and the
#      widget bundle host (localhost:4173).
#   4. Bump client_max_body_size so user photo uploads (multipart, ~5-20 MB)
#      don't bounce off the default 1 MB nginx limit.
# =============================================================================

server {
    listen       80 default_server;
    server_name  _;

    client_max_body_size 50M;

    # --- Widget static assets (mounted from the widget source tree) ---
    location ^~ /s3/widget-assets/ {
        alias /srv/widget-assets/;

        add_header Access-Control-Allow-Origin  *                   always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Cache-Control                "public, max-age=3600" always;

        try_files $uri =404;
    }

    # --- Everything else → Go backend ---
    location / {
        proxy_pass         http://backend:3010;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin            $http_origin;
        proxy_set_header Referer           $http_referer;

        # Long enough for the slowest Gemini try-on call (GEMINI_TIMEOUT_SEC=300)
        proxy_connect_timeout 10s;
        proxy_read_timeout    330s;
        proxy_send_timeout    330s;

        # No body buffering for multipart uploads
        proxy_request_buffering off;
    }

    location = /edge-health {
        default_type text/plain;
        return 200 "ok\n";
    }
}
