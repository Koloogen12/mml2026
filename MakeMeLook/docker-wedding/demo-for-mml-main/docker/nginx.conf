server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Keep redirects relative so the browser preserves the :8080 host port.
    # Without this nginx rewrites Location to $scheme://$host/... and drops
    # the non-standard port.
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_types text/plain application/javascript application/json text/css image/svg+xml;
    gzip_min_length 1024;

    # Landing → /shop/  (relative → browser keeps current host:port)
    location = / {
        return 302 /shop/;
    }

    # /shop (no slash) → /shop/
    location = /shop {
        return 302 /shop/;
    }

    # SPA fallback under /shop/
    location /shop/ {
        try_files $uri $uri/ /shop/index.html;
    }

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }
}
