server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_types text/plain application/javascript application/json text/css image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback under /shopping/
    location /shopping/ {
        try_files $uri $uri/ /shopping/index.html;
    }

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Everything else — 404. The public site at b2b.makemelook.ai routes
    # /shop and / to the SaaS, we only own /shopping here.
    location / {
        return 404;
    }
}
