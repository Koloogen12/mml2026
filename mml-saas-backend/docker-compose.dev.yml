services:
  postgres:
    container_name: mml-saas-postgres
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: makemelook
      POSTGRES_PASSWORD: makemelook
      POSTGRES_DB: makemelook
    ports:
      - "5414:5432"
    volumes:
      - mml-saas-pgdata:/var/lib/postgresql/data

  minio:
    container_name: mml-saas-minio
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - mml-saas-minio:/data

volumes:
  mml-saas-pgdata:
  mml-saas-minio:
