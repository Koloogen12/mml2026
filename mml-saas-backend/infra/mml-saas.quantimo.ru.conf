server {
  server_name mml-saas.quantimo.ru;

  access_log /var/log/nginx/mml-saas.quantimo.ru.access.log;
  error_log /var/log/nginx/mml-saas.quantimo.ru.error.log;

  root /opt/mml/mml-saas-frontend/dist;
  index index.html;

  # Публичный Widget API — разрешаем CORS с любого домена
  # (виджет встраивается на сайты клиентов; ограничение по домену — через widget_domains в БД)
  location /api/widget/v1/ {
    if ($request_method = 'OPTIONS') {
      add_header Access-Control-Allow-Origin  "*";
      add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
      add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Session-ID";
      add_header Access-Control-Max-Age       86400;
      add_header Content-Length               0;
      return 204;
    }

    # Скрываем CORS-заголовок бэкенда, чтобы не было дублирования
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;

    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Session-ID" always;

    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_read_timeout    120s;
    proxy_send_timeout    30s;

    client_max_body_size 20M;
  }

  # SaaS Cabinet API
  location /api/ {
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_read_timeout    120s;
    proxy_send_timeout    30s;

    client_max_body_size 20M;
  }

  # Minio S3 storage (strip /s3 prefix)
  # Use ^~ modifier to prevent regex locations from overriding this
  location ^~ /s3/ {
    rewrite ^/s3/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:9010;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Allow CORS for assets
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, Content-Type" always;

    # Cache images
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /widget/ {
    alias /opt/mml/mml-saas-widget-tryon/dist/;
    add_header Access-Control-Allow-Origin "*" always;

    # loader.js — короткий кеш (обновляется при деплое)
    location = /widget/loader.js {
      expires 1h;
      add_header Cache-Control "public";
      add_header Access-Control-Allow-Origin "*" always;
    }

    # widget.js и widget.css — долгий кеш
    location ~* ^/widget/.*\.(js|css)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      add_header Access-Control-Allow-Origin "*" always;
    }
  }

  # SPA routes
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Static assets (JS, CSS, fonts)
  # Images are served via /s3/ from Minio
  location ~* \.(js|css|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  listen 443 ssl; # managed by Certbot
  ssl_certificate /etc/letsencrypt/live/mml-saas.quantimo.ru/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/mml-saas.quantimo.ru/privkey.pem; # managed by Certbot
  include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
  if ($host = mml-saas.quantimo.ru) {
    return 301 https://$host$request_uri;
  } # managed by Certbot

  listen 80;
  server_name mml-saas.quantimo.ru;
  return 404; # managed by Certbot
}