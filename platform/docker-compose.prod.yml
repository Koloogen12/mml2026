# Прод-стек платформы одним файлом: Postgres(pgvector) + reco + backend + web(nginx).
# TLS — сверху (certbot на хосте или отдельный прокси). Секреты — в .env рядом.
# Запуск:  docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

# Имя проекта прибито здесь, а не только в .env.prod: иначе compose берёт его из
# имени папки, и запуск без --env-file поднимает ВТОРОЙ стек со своими томами
# рядом с живым. Один раз так уже случилось.
name: mmlplat

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-platform}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?required}
      POSTGRES_DB: ${PG_DB:-mml_platform}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-platform}"]
      interval: 10s
      timeout: 5s
      retries: 5

  reco:
    build: ./reco
    restart: unless-stopped
    environment:
      HF_HOME: /app/.hf
    volumes:
      - hfcache:/app/.hf   # кэш весов моделей между рестартами
    expose:
      - "8091"
    # Лимит обязателен: платформа делит сервер с продом виджета. Без потолка
    # torch+Marqo под нагрузкой могут выесть память, и OOM-killer придёт не за
    # ними, а за чужим postgres.
    deploy:
      resources:
        limits:
          memory: 4g
    mem_limit: 4g

  # Объектное хранилище файлов партнёра (лого/размерная сетка).
  # STORAGE_PUBLIC_URL должен быть браузеро-доступным: проксировать бакет через
  # nginx (напр. cdn.makemelook.ai → minio:9000) или вынести на внешний S3.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:?required}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:?required}
    volumes:
      - miniodata:/data
    expose:
      - "9000"

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: prod
      PORT: "8090"
      DATABASE_URL: postgres://${PG_USER:-platform}:${PG_PASSWORD:?required}@postgres:5432/${PG_DB:-mml_platform}?sslmode=disable
      MIGRATE_ON_START: "true"
      RECO_URL: http://reco:8091
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?required}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_PROXY_KEY: ${ANTHROPIC_PROXY_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?required}
      CLICK_SIGNING_SECRET: ${CLICK_SIGNING_SECRET:?required}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?required}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM}
      # Стартовое число счётчика на главной (продуктовое решение, не техническое):
      WAITLIST_BASE: ${WAITLIST_BASE:-800}
      # Реальная примерка (пусто → mock, включается координируемым релизом виджета):
      WIDGET_BASE_URL: ${WIDGET_BASE_URL}
      WIDGET_PROJECT_ID: ${WIDGET_PROJECT_ID}
      WIDGET_API_KEY: ${WIDGET_API_KEY}
      # Загрузки файлов партнёра (пусто STORAGE_ENDPOINT → загрузки off, 501):
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-minio:9000}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-partner-assets}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL}
      STORAGE_USE_SSL: ${STORAGE_USE_SSL:-false}
      # OAuth-вход (пусто → провайдер выключен):
      # APP_BASE_URL — origin, куда провайдер шлёт callback (должен совпадать с
      # redirect_uri в консолях Google/Яндекса).
      # APP_FRONT_URL — куда возвращается ЧЕЛОВЕК после входа. Разные вещи: API
      # живёт в корне, а приложение под /app. Без этой строки код падает на
      # запасной APP_BASE_URL и выкидывает вошедшего в корень — на вейтлист.
      APP_BASE_URL: ${APP_BASE_URL}
      APP_FRONT_URL: ${APP_FRONT_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      reco:
        condition: service_started
      minio:
        condition: service_started
    expose:
      - "8090"

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-80}:80"   # TLS терминировать выше; при certbot-компаньоне добавить 443

volumes:
  pgdata:
  hfcache:
  miniodata:
