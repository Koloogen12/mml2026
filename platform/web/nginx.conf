# Три приложения ПО ПУТЯМ на одном домене + реверс-прокси API на бэкенд.
#
# Почему не по поддоменам, как задумывалось: makemelook.ai в корне занят живой
# страницей вейтлиста (статика хостового nginx, форма шлёт в бэкенд ВИДЖЕТА на
# :8089), b2b.makemelook.ai занят Next.js-лендингом, а app.makemelook.ai в DNS
# нет. Поэтому платформа живёт под путями:
#   /app      — покупатель
#   /partner  — кабинет партнёра
#   /console  — админка
# Корень / сюда не приходит вообще: хостовый nginx отдаёт там вейтлист.
#
# TLS терминируется выше (certbot на хосте) — здесь только :80 внутри compose.
# Резолв бэкенда — через встроенный DNS Docker (127.0.0.11) в рантайме, а не на
# старте: nginx не упадёт, если backend временно недоступен/перезапускается.

server {
    listen 80;
    server_name _;
    index index.html;

    resolver 127.0.0.11 valid=30s;
    set $backend http://backend:8090;

    # --- API и редиректы ---
    # Весь /api/ идёт в бэкенд платформы, включая /api/v1/waitlist: на прежнем
    # сервере хостовый nginx уводил вейтлист в бэкенд виджета, здесь такой
    # развилки нет — обработчик вейтлиста есть в самой платформе.
    location /api/ { proxy_pass $backend; include /etc/nginx/proxy_common.conf; }
    location /r/   { proxy_pass $backend; include /etc/nginx/proxy_common.conf; }
    location /cpa/ { proxy_pass $backend; include /etc/nginx/proxy_common.conf; }
    location = /healthz { proxy_pass $backend; include /etc/nginx/proxy_common.conf; }

    # Юр-страницы — статика, НЕ SPA-fallback: на /legal/* ссылаются все три
    # приложения (согласия, 152-ФЗ). Без этого index.html съел бы их.
    location /legal/ {
        alias /usr/share/nginx/html/buyer/legal/;
        try_files $uri $uri/ =404;
    }

    location = /robots.txt { alias /usr/share/nginx/html/buyer/robots.txt; }

    # --- Покупатель ---
    location /app {
        alias /usr/share/nginx/html/buyer;
        try_files $uri $uri/ /app/index.html;
    }

    # --- Кабинет партнёра ---
    location /partner {
        alias /usr/share/nginx/html/partner;
        try_files $uri $uri/ /partner/index.html;
    }

    # --- Админка. Доступ ограничен: без токена ручки всё равно закрыты
    #     (ADMIN_TOKEN), но и саму консоль прятать правильнее. ---
    location /console {
        alias /usr/share/nginx/html/admin;
        try_files $uri $uri/ /console/index.html;
    }

    # Корень — страница вейтлиста. На прежнем сервере её отдавал хостовый
    # nginx мимо compose; на новой площадке единая точка входа — Caddy, а он
    # не может читать файлы из чужого стека, поэтому статика уехала внутрь
    # этого образа. Форма вейтлиста и OAuth-кнопки бьют в /api/ выше.
    location / {
        root /usr/share/nginx/html/root;
        try_files $uri $uri/ /index.html;
    }
}
